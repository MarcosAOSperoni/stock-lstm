[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-lstm"
version = "0.1.0"
description = "LSTM stock predictor for the point-in-time S&P 500 with an alternative-data evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "pyyaml>=6",
    "requests>=2.31",
    "yfinance>=0.2.50",
    "lightgbm>=4.3",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
lstm = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
stocklstm = "stocklstm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
